[workspace]
name = "kingdom-come-deliverance-headtracking"
version = "0.0.0"
description = "Head tracking mod for Kingdom Come: Deliverance (CryEngine)"
license = "MIT"
license-file = "LICENSE"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
# Sync the cameraunlock-core submodule to its tracked branch.
sync = "git submodule update --remote cameraunlock-core"

# No -G: let CMake auto-detect the installed Visual Studio generator. Pinning
# "Visual Studio 17 2022" broke on CI once the windows runner image moved to
# VS 2026 (VS 17 absent); auto-detect picks whatever VS the machine has.
setup = { cmd = """
    powershell -Command "if (-not (Test-Path 'build')) { cmake -B build -A x64 } else { Write-Host 'Build directory exists, skipping setup' -ForegroundColor Yellow }"
""" }

build = { cmd = "cmake --build build --config Release", depends-on = ["setup"] }
build-debug = { cmd = "cmake --build build --config Debug", depends-on = ["setup"] }

# Characterization tests for the parts of the provider that are decidable
# without a game process, the config differential test
# (tests/config_differential), and core's canonical config lint over the
# committed file and every file that test migrated (run with node). Same build
# the DLL comes out of, so CI runs it too.
test = { cmd = "ctest --test-dir build -C Release --output-on-failure", depends-on = ["build"] }

# Rewrite the committed CameraUnlock.ini, the table's fresh render and so the
# file a first launch creates, after a change to a row, a comment or a default,
# then write the manifest config block's per_game from it. The render test in
# kcd_tests fails until the committed file matches.
render-config = { cmd = "build/tests/Release/kcd_tests.exe --render-config CameraUnlock.ini && node cameraunlock-core/scripts/encode-seed.mjs", depends-on = ["build"] }

# Checks the newest release/*-installer.zip against its launcher-manifest.json,
# and that the Nexus ZIP carries neither CameraUnlock.ini nor HeadTracking.ini.
# Run after package.
validate-manifest = "node cameraunlock-core/scripts/validate-manifest.mjs"

# Print the PE fingerprint of every installed copy of the game. Every camera
# address this mod uses is a WHGame.dll RVA, so a fingerprint change IS a break:
# the mod stays dormant until a profile for the new build is added. First thing
# to run when the log says it did not recognise the game.
#
# Steam, GOG and Game Pass ship separate links of the same game version, each
# needing its own profile, so this checks all of them rather than the first one
# detection returns.
check-fingerprint = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/check-fingerprint.ps1" }

# Refresh the vendored loader from upstream. A deliberate developer action with a
# commit behind it - never part of build, package or release.
update-deps = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1"

clean = { cmd = """
    powershell -Command "if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }; Write-Host 'Build artifacts cleaned' -ForegroundColor Green"
""" }

clean-all = { cmd = """
    powershell -Command "foreach ($d in @('build','release')) { if (Test-Path $d) { Remove-Item $d -Recurse -Force } }; Write-Host 'All build artifacts cleaned' -ForegroundColor Green"
""" }

# Package release ZIPs (installer + nexus). Depends on test, so the config
# differential test gates every package, CI's included.
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["test"] }

# Build + deploy to every installed copy of the game (dev loop). Steam, GOG and
# Game Pass each get the ASI and the loader, in the directory their own
# executable lives in - Bin\Win64 for the first two, the package Content folder
# for Game Pass.
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1", depends-on = ["build"] }

# Remove the mod from every install deploy wrote to. The wrapper calls
# uninstall.cmd once per install, always with /y: `pixi run` gives the child no
# TTY, so uninstall.cmd's trailing `pause` throws "IOException: The handle is
# invalid" and kills the task without it.
uninstall = "powershell -ExecutionPolicy Bypass -File scripts/uninstall-all.ps1"

# Automated release workflow (version bump, changelog, build, tag, push).
# Fully unattended: pixi run release <major|minor|patch|nightly|X.Y.Z>
release = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1" }

[dependencies]
# CMake and Visual Studio come from the system. Node runs core's canonical
# config lint under `test`, render-config's per_game step and validate-manifest,
# pinned to the release core's own lock resolves.
nodejs = "==26.5.0"
