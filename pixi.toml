[workspace]
name = "kingdom-come-deliverance-headtracking"
version = "0.0.0"
description = "Head tracking mod for Kingdom Come: Deliverance (CryEngine)"
license = "MIT"
license-file = "LICENSE"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
# Sync the cameraunlock-core submodule to its tracked branch.
sync = "git submodule update --remote cameraunlock-core"

# No -G: let CMake auto-detect the installed Visual Studio generator. Pinning
# "Visual Studio 17 2022" broke on CI once the windows runner image moved to
# VS 2026 (VS 17 absent); auto-detect picks whatever VS the machine has.
setup = { cmd = """
    powershell -Command "if (-not (Test-Path 'build')) { cmake -B build -A x64 } else { Write-Host 'Build directory exists, skipping setup' -ForegroundColor Yellow }"
""" }

build = { cmd = "cmake --build build --config Release", depends-on = ["setup"] }
build-debug = { cmd = "cmake --build build --config Debug", depends-on = ["setup"] }

# Characterization tests for the parts of the provider that are decidable
# without a game process. Same build the DLL comes out of, so CI runs it too.
test = { cmd = "ctest --test-dir build -C Release --output-on-failure", depends-on = ["build"] }

# Print the PE fingerprint of the installed game binaries. Every camera address
# this mod uses is a WHGame.dll RVA, so a fingerprint change IS a break: the mod
# stays dormant until a profile for the new build is added. First thing to run
# when the log says it did not recognise the game.
check-fingerprint = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/check-fingerprint.ps1" }

# Refresh the vendored loader from upstream. A deliberate developer action with a
# commit behind it - never part of build, package or release.
update-deps = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1"

clean = { cmd = """
    powershell -Command "if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }; Write-Host 'Build artifacts cleaned' -ForegroundColor Green"
""" }

clean-all = { cmd = """
    powershell -Command "foreach ($d in @('build','release')) { if (Test-Path $d) { Remove-Item $d -Recurse -Force } }; Write-Host 'All build artifacts cleaned' -ForegroundColor Green"
""" }

# Package release ZIPs (installer + nexus).
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["build"] }

# Build + deploy to the detected game directory (dev loop).
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1", depends-on = ["build"] }

# Remove the mod from the game directory. /y is mandatory: `pixi run` gives the
# child no TTY, so uninstall.cmd's trailing `pause` throws "IOException: The
# handle is invalid" and kills the task without it.
uninstall = "scripts\\uninstall.cmd /y"

# Automated release workflow (version bump, changelog, build, tag, push).
# Fully unattended: pixi run release <major|minor|patch|nightly|X.Y.Z>
release = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1" }

[dependencies]
# No pixi-managed deps - relies on system CMake + Visual Studio.
